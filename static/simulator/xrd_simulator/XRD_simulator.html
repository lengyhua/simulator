<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>XRD 模拟与仿真平台</title>
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/XRD_simulator.css">
    <link rel="stylesheet" href="css/custom-dd-jquery-ui.css">
    <script src="js/jquery-3.2.1.min.js"></script>
    <script src="js/jquery-ui.min.js"></script>
</head>

<body>
    <!-- ── Platform Shell ── -->
    <div id="top-bar" style="display:none"></div>
    <header class="platform-header">
        <div class="platform-title-row">
            <div class="logo">X</div>
            <span class="platform-name">XRD 模拟与仿真平台</span>
        </div>
        <nav class="tab-bar">
            <button class="tab active">XRD 模拟</button>
            <button class="tab" disabled>图谱分析</button>
            <button class="tab" disabled>数据管理</button>
        </nav>
    </header>

    <!-- ── Instrument UI ── -->
    <div id="simulator-base" class="flex modal-is-open">
        <div id="top-instructions" class="top-instructions-on">
            <p id="top-instructions-txt">请从下拉菜单中选择样品</p>
        </div>

        <div id="controls-left">
            <div class="field-group" id="first-row">
                <p class="section-label">样品</p>
                <div style="display:flex; gap:10px; align-items:flex-end;">
                    <fieldset style="flex:1; border:none; margin:0; padding:0;">
                        <label id="specimen-label" style="font-size:11px; font-weight:600; letter-spacing:.08em; color:var(--text-dim); text-transform:uppercase; display:block; margin-bottom:6px;">样品</label>
                        <select id="specimen" autocomplete="off">
                            <option selected="selected" disabled></option>
                            <option value="0">3D 打印 ABS</option>
                            <option value="1">316 钢粉末</option>
                            <option value="2">铝</option>
                            <option value="3">电弧喷涂铜</option>
                            <option value="4">氮化硼</option>
                            <option value="5">碳纤维</option>
                            <option value="6">玻璃</option>
                            <option value="7">玻璃碳</option>
                            <option value="8">HOPG</option>
                            <option value="9">Ni WC 粉末</option>
                            <option value="10">纸</option>
                            <option value="11">聚乙烯</option>
                            <option value="12">聚丙烯</option>
                            <option value="13">聚苯乙烯</option>
                            <option value="14">NaCl</option>
                            <option value="15">砂</option>
                            <option value="16">硅粉</option>
                            <option value="17">糖</option>
                            <option value="18">TiC 粉末</option>
                            <option value="19">TiO 粉末</option>
                        </select>
                    </fieldset>
                    <div id="doors-div" class="btn-with-title" style="flex:0 0 auto;">
                        <label id="doors-label" class="btn-title label-disabled">舱门</label>
                        <button type="button" id="btn-doors" class="btn btn-disabled" value="off" disabled>开门</button>
                    </div>
                </div>
            </div>

            <div class="row2" id="second-row">
                <div class="field-group">
                    <div class="btn-with-title standby-wrap">
                        <label id="standby-label" class="btn-title label-disabled">待机/开机</label>
                        <button type="button" id="btn-standby" value="off" disabled>
                            <span class="pill-dot"></span>
                        </button>
                    </div>
                </div>
                <div class="field-group">
                    <div id="power-div" class="btn-with-title power-wrap">
                        <label id="power-label" class="btn-title label-disabled">全功率</label>
                        <button type="button" id="btn-power" class="btn btn-disabled" value="off" disabled>关</button>
                    </div>
                </div>
            </div>

            <div class="row2">
                <div class="field-group">
                    <p class="section-label">kV</p>
                    <div id="stats-kv" class="readout div-disabled">
                        <span class="label">kV</span>
                        <span class="value" id="kv-val">10</span>
                    </div>
                </div>
                <div class="field-group">
                    <p class="section-label">mA</p>
                    <div id="stats-ma" class="readout div-disabled">
                        <span class="label">mA</span>
                        <span class="value" id="ma-val">10</span>
                    </div>
                </div>
            </div>

            <div class="field-group" id="third-row">
                <p class="section-label">扫描设置</p>
                <div style="display:flex; gap:10px; margin-bottom:10px;">
                    <div id="start-div" class="readout accent div-disabled" style="flex:1;">
                        <span class="label">起始 2θ</span>
                        <span class="value" id="start-txt">5°</span>
                        <div id="stats-start" class="angle">
                            <button type="button" id="btn-start-up" class="btn-stats btn-stats-up btn-disabled" disabled title="增大起始角"><svg viewBox="0 0 12 12" width="14" height="14" aria-hidden="true"><path d="M2.5 8 6 4l3.5 4z" fill="currentColor"/></svg></button>
                            <button type="button" id="btn-start-dw" class="btn-stats btn-stats-dw btn-disabled" disabled title="减小起始角"><svg viewBox="0 0 12 12" width="14" height="14" aria-hidden="true"><path d="M2.5 4 6 8l3.5-4z" fill="currentColor"/></svg></button>
                        </div>
                    </div>
                    <div id="end-div" class="readout accent div-disabled" style="flex:1;">
                        <span class="label">终止 2θ</span>
                        <span class="value" id="end-txt">80°</span>
                        <div id="stats-end" class="angle">
                            <button type="button" id="btn-end-up" class="btn-stats btn-stats-up btn-disabled" disabled title="增大终止角"><svg viewBox="0 0 12 12" width="14" height="14" aria-hidden="true"><path d="M2.5 8 6 4l3.5 4z" fill="currentColor"/></svg></button>
                            <button type="button" id="btn-end-dw" class="btn-stats btn-stats-dw btn-disabled" disabled title="减小终止角"><svg viewBox="0 0 12 12" width="14" height="14" aria-hidden="true"><path d="M2.5 4 6 8l3.5-4z" fill="currentColor"/></svg></button>
                        </div>
                    </div>
                </div>

                <div id="step-options" style="margin-bottom:10px;">
                    <div style="display:flex; gap:10px;">
                        <fieldset style="flex:1; border:none; margin:0; padding:0;">
                            <label id="step-label" style="font-size:11px; font-weight:600; letter-spacing:.08em; color:var(--text-dim); text-transform:uppercase; display:block; margin-bottom:6px;">步长</label>
                            <select id="step" autocomplete="off" class="label-disabled">
                                <option value="empty" selected="selected" disabled>请选择</option>
                                <option value="1">0.005°</option>
                                <option value="9">0.01°</option>
                                <option value="15">0.02°</option>
                            </select>
                        </fieldset>
                        <fieldset id="time-step-fieldset" style="flex:1; border:none; margin:0; padding:0;">
                            <label id="time-step-label" style="font-size:11px; font-weight:600; letter-spacing:.08em; color:var(--text-dim); text-transform:uppercase; display:block; margin-bottom:6px;">扫描速率</label>
                            <select id="time-step" autocomplete="off" class="label-disabled">
                                <option value="empty" selected="selected" disabled>请选择</option>
                                <option value="0">0.2 °/s</option>
                                <option value="1">0.08 °/s</option>
                                <option value="2">0.04 °/s</option>
                            </select>
                        </fieldset>
                    </div>
                </div>

                <div id="scantime-div" class="btn-with-title div-disabled" style="display:flex; align-items:center; justify-content:space-between; background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:8px 12px;">
                    <label id="scantime-label" class="btn-title label-disabled" style="font-size:11px; font-weight:600; letter-spacing:.08em; color:var(--text-dim); text-transform:uppercase; margin:0;">预计时间</label>
                    <div id="scantime-value" style="all:unset;">
                        <p id="scantime-val" class="stat-title" style="font-family:var(--font-mono); font-size:14px; color:var(--text-dim); margin:0;">—</p>
                    </div>
                </div>
            </div>

            <div id="bottom-row" class="flex-evenly">
                <button type="button" id="btn-start-scan" class="btn btn-primary btn-disabled" value="off" disabled>开始扫描</button>
                <button type="button" id="btn-save-dff" class="btn btn-disabled" value="off" disabled>保存衍射图</button>
            </div>

            <div id="fil-current" class="channel-slider"></div>
        </div>

        <!-- Right instrument view -->
        <div id="canvas-div">
            <div class="diagram-card">
                <div class="diagram-inner">
                    <div class="diagram-box">
                        <svg id="svg-diagram" viewBox="0 0 2640 2080"></svg>
                        <span class="card-label">X 射线光路</span>
                        <div class="diagram-overlay">
                            <span id="range-2theta" class="diagram-range">2θ 范围：5° – 80°</span>
                            <div id="controls-right">
                                <div id="shutter-div" class="btn-with-title">
                                    <div type="button" id="btn-shutter" value="off" disabled>关闭</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="diffractogram-card">
                <span class="card-label">衍射图谱</span>
                <div class="curve-stage">
                    <div class="curve-box">
                        <svg id="svg-curve" viewBox="-20 -15 835 655" preserveAspectRatio="none"></svg>
                        <canvas id="canvas-curve"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading modal -->
    <div id="loading-modal" class="flex any-modal">
        <div class="modal-window">
            <div class="modal-title flex-between">
                <p>正在加载资源…</p>
                <span id="close-loading-modal" class="close-modal totally-hidden">×</span>
            </div>
            <div class="flex modal-content">
                <div class="loading-bar"></div>
            </div>
        </div>
    </div>

    <script src="js/anime.min.js"></script>
    <script src="js/XRD_instruction_steps.js"></script>
    <script src="js/XRD_steps.js"></script>
    <script src="js/simulator_snippets.js"></script>
    <script src="js/XRD_data.js"></script>
    <script src="js/XRD_simulator.js"></script>
</body>
</html>
